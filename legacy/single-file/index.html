<title>樱花小镇星球 · Sakura Town Planet</title>
<meta name="description" content="A fully procedural, single-file Three.js anime sakura town on a tiny walkable planet. No external models or textures." />
<style>
:root{--ink:#2b2030}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:#151a3a;font-family:-apple-system,"PingFang SC","Hiragino Sans","Noto Sans CJK SC","Microsoft YaHei",sans-serif;color:#fff;-webkit-user-select:none;user-select:none;touch-action:none}
canvas{display:block}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 40%,rgba(255,170,200,.35),rgba(20,16,48,.93) 72%);z-index:20;cursor:pointer;text-align:center;padding:24px;transition:opacity .6s}
#start.hide{opacity:0;pointer-events:none}
#start h1{font-size:clamp(30px,6vw,58px);margin:0 0 8px;letter-spacing:.08em;text-shadow:0 4px 26px rgba(255,120,160,.65)}
#start h2{font-weight:400;font-size:clamp(14px,2.3vw,19px);margin:0 0 28px;opacity:.85}
#start .go{padding:14px 34px;border-radius:999px;background:linear-gradient(135deg,#ff9fbf,#ffd29f);color:var(--ink);font-weight:700;font-size:18px;box-shadow:0 8px 30px rgba(255,140,180,.5)}
#start .go.wait{opacity:.5}
#start .keys{margin-top:26px;font-size:13px;line-height:2;opacity:.85;max-width:680px}
#start .keys b{display:inline-block;min-width:22px;padding:0 6px;margin:0 2px;border-radius:5px;background:rgba(255,255,255,.18);font-weight:600}
#loading{margin-top:14px;font-size:13px;opacity:.75}
#hud{position:fixed;left:14px;top:12px;z-index:5;font-size:13px;line-height:1.65;text-shadow:0 1px 3px rgba(0,0,0,.7);pointer-events:none}
#hud .t{font-weight:700;font-size:15px}
#scenes{position:fixed;right:12px;top:12px;z-index:6;display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end;max-width:min(600px,64vw)}
.chip{pointer-events:auto;cursor:pointer;padding:6px 11px;border-radius:999px;background:rgba(20,16,48,.55);border:1px solid rgba(255,255,255,.25);color:#fff;font-size:12px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);white-space:nowrap}
.chip:hover,.chip.on{background:rgba(255,150,185,.65)}

#cross{position:fixed;left:50%;top:50%;width:6px;height:6px;margin:-3px 0 0 -3px;border-radius:50%;background:rgba(255,255,255,.75);z-index:4;pointer-events:none}
body.hideui #hud,body.hideui #scenes,body.hideui #cross{display:none}
#touch{display:none}
body.touch #touch{display:block}
body.touch #cross{display:none}
#joy{position:fixed;left:22px;bottom:26px;width:132px;height:132px;border-radius:50%;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.3);z-index:6}
#knob{position:absolute;left:41px;top:41px;width:50px;height:50px;border-radius:50%;background:rgba(255,255,255,.5)}
#tbtns{position:fixed;right:16px;bottom:26px;z-index:6;display:grid;grid-template-columns:repeat(3,60px);gap:8px}
#tbtns .chip{height:48px;display:flex;align-items:center;justify-content:center;font-size:13px;padding:0}

  document.querySelectorAll('#scenes .chip').forEach((c, k) => c.classList.toggle('on', k === i));
  toast(`${i + 1} · ${s.name}`);
}
SCENES.forEach((s, i) => { const b = document.createElement('div'); b.className = 'chip'; b.textContent = `${i + 1} ${s.name}`; b.onclick = e => { e.stopPropagation(); goScene(i); }; $('scenes').appendChild(b); });
const chips = document.createElement('div'); chips.className = 'chip'; chips.textContent = '☀/🌙 日夜'; chips.onclick = e => { e.stopPropagation(); toggleNight(); }; $('scenes').appendChild(chips);
function toggleNight() { T.target = T.night > 0.5 ? 0.40 : 0.90; toast(T.night > 0.5 ? '天亮了 ☀' : '夜幕降临 🌙'); }
function onKey(code) {
  if (code === 'KeyF') { P.fly = !P.fly; if (P.fly && P.riding < 0) P.alt += 3; toast(P.fly ? '飞行模式 · 空格上升 C 下降' : '步行模式'); }
  else if (code === 'KeyN') toggleNight();
  else if (code === 'KeyT') { T.auto = !T.auto; toast(T.auto ? '时间流动 ⏩' : '时间暂停 ⏸'); }
  else if (code === 'KeyM') { AU.muted = !AU.muted; toast(AU.muted ? '静音 🔇' : '声音 🔊'); }
  else if (code === 'KeyE') toggleBoard();
  else if (code === 'KeyH') document.body.classList.toggle('hideui');

}
addEventListener('keydown', e => { if (e.repeat) { keys[e.code] = true; return; } keys[e.code] = true; if (started) onKey(e.code); if (['Space', 'ArrowUp', 'ArrowDown'].includes(e.code)) e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
const cv = renderer.domElement;
let dragging = false, lx = 0, ly = 0;
cv.addEventListener('mousedown', e => { if (!isTouch && started && document.pointerLockElement !== cv) { cv.requestPointerLock?.(); } dragging = true; lx = e.clientX; ly = e.clientY; });
addEventListener('mouseup', () => dragging = false);
addEventListener('mousemove', e => {
  if (document.pointerLockElement === cv) look(e.movementX * 0.0022, e.movementY * 0.0022);
  else if (dragging && !isTouch) { look((e.clientX - lx) * 0.004, (e.clientY - ly) * 0.004); lx = e.clientX; ly = e.clientY; }
});
// touch: left joystick + drag anywhere else to look
let joyId = null, lookId = null, jx0 = 0, jy0 = 0, tlx = 0, tly = 0;
const jEl = $('joy'), knob = $('knob');
jEl.addEventListener('touchstart', e => { const t = e.changedTouches[0]; joyId = t.identifier; const r = jEl.getBoundingClientRect(); jx0 = r.left + r.width / 2; jy0 = r.top + r.height / 2; e.preventDefault(); }, { passive: false });

  for (const t of e.changedTouches) {
    if (t.identifier === joyId) { let dx = (t.clientX - jx0) / 55, dy = (t.clientY - jy0) / 55; const l = Math.hypot(dx, dy); if (l > 1) { dx /= l; dy /= l; } joy.x = dx; joy.y = dy; knob.style.transform = `translate(${dx * 40}px,${dy * 40}px)`; }
    else if (t.identifier === lookId) { look((t.clientX - tlx) * 0.005, (t.clientY - tly) * 0.005); tlx = t.clientX; tly = t.clientY; }

addEventListener('touchend', e => { for (const t of e.changedTouches) { if (t.identifier === joyId) { joyId = null; joy.x = joy.y = 0; knob.style.transform = ''; } if (t.identifier === lookId) lookId = null; } });
document.querySelectorAll('#tbtns .chip').forEach(b => {
  const k = b.dataset.k;
  b.addEventListener('touchstart', e => { e.preventDefault(); e.stopPropagation(); AU.start();
    if (k === 'up' || k === 'down') touch[k] = true; else if (k === 'run') { touch.run = !touch.run; b.classList.toggle('on', touch.run); }
    else if (k === 'fly') onKey('KeyF'); else if (k === 'night') toggleNight(); else if (k === 'board') toggleBoard(); }, { passive: false });
  b.addEventListener('touchend', e => { if (k === 'up' || k === 'down') touch[k] = false; });
});
function zoneName(L, alt) {
  if (alt > 30) return '星球上空';
  if (P.riding >= 0) return '电车车厢';
  if (Math.abs(L.x - CROSS_X) < 7 && Math.abs(L.z) < 6) return '踏切 · 铁路道口';
  if (L.x > -34 && L.x < 12 && L.z < 3 && L.z > -16) return '桜ヶ丘駅 · 车站';
  if (L.z < -44 && L.z > -52 && L.x < 22) return 'はなみち横丁 · 灯笼小巷';
  if (L.x > 14 && L.x < 46 && L.z < -8 && L.z > -92) return 'さくら通り商店街';
  if (L.x > 12 && L.x < 48 && L.z > 4 && L.z < 92) return '桜並木 · 樱花大道';
  if (Math.hypot(L.x - 56, L.z - 31) < 14) return '桜ヶ丘公園';
  if (Math.hypot(L.x - SEA.x, L.z - SEA.z) < 95 && L.x < -10 && L.z > 20) return 'みなと · 码头';

}

// ============================================================ MAIN
let started = false, built = false;
const clock = new THREE.Clock();
function build() {
  const t0 = performance.now();
  buildGround(); buildSea(); buildRailway(); buildRoads(); buildStation(); buildCrossing();
  buildShoppingStreet(); buildAlley(); buildAvenue(); buildHarbour(); scatterPlanet();
  const lines = [];
  for (const [x0, x1] of [[-88, -9], [9, 88]]) { let prev = null; for (let z = x0; z <= x1; z += 14) { const pts = utilityPole(34.0, z, 0); if (prev) for (let k = 0; k < 3; k++) catenary(prev[k], pts[k], 0.55); prev = pts; } }
  flushStatic(); buildLanterns(); buildBlossoms(); buildCarpets(); buildGreens(); clothesMesh = buildClothes(); buildFX(); buildTrain(); buildNPCs();
  onResizeFX(); goScene(0);
  built = true; console.log(`[sakura] built in ${(performance.now() - t0) | 0} ms · blossoms ${blossomM.length} · lanterns ${lanterns.length} · colliders ${colliders.length}`);
}
function frame() {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, clock.getDelta()); if (!built) return;
  U.time.value += dt; const t = U.time.value;
  updateTime(dt); updateTrain(dt); updateCrossing(dt, t); updatePlayer(dt);
  // camera
  const fwd = P.fwd.clone().multiplyScalar(Math.cos(P.pitch)).addScaledVector(P.up, Math.sin(P.pitch));
  if (P.riding >= 0) { const car = TR.cars[P.riding], y = P.rl.yaw; fwd.set(Math.cos(y) * Math.cos(P.pitch), Math.sin(P.pitch), -Math.sin(y) * Math.cos(P.pitch)).applyQuaternion(car.quaternion); }
  camera.position.copy(P.pos); camera.up.copy(P.up); camera.lookAt(P.pos.clone().add(fwd));
  sky.position.copy(camera.position);
  updateLights(P); updateNPCs(dt, camera.position); updateClothes(t); updateHarbour(t, T.night, camera.position);
  U.wind.value.set(Math.sin(t * 0.3) * 0.5 + 0.6, 0.2, Math.cos(t * 0.23) * 0.4 + 0.3);
  // audio mix
  const L = toLocal(P.pos), groundH = P.alt;
  let td = 1e9; TR.cars.forEach(c => td = Math.min(td, c.position.distanceTo(P.pos)));
  AU.update({ fly: P.fly, night: T.night, sea: smooth(70, 12, Math.hypot(L.x - SEA.x, L.z - SEA.z) - 40), train: P.riding >= 0 ? 0.8 : smooth(70, 4, td), tv: TR.v, bell: crossing.active ? smooth(80, 4, worldAt(CROSS_X, 0).distanceTo(P.pos)) : 0 });
  if (toastT > 0 && (toastT -= dt) <= 0) $('toast').style.opacity = 0;
  if ((frame.n = (frame.n || 0) + 1) % 15 === 0) {
    const h = Math.floor(T.tod * 24), m = Math.floor((T.tod * 24 - h) * 60);
    $('info').innerHTML = `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')} ${T.night > 0.5 ? '🌙' : '☀️'} · ${zoneName(L, groundH)}<br>${P.riding >= 0 ? '乘车中 · E 下车' : P.fly ? '飞行中 · F 落地' : '步行 · F 飞行'}${T.auto ? '' : ' · ⏸'}`;
  }
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
setTimeout(() => {
  try { build(); $('go').textContent = '点击进入 · Click to start'; $('go').classList.remove('wait'); $('loading').textContent = isTouch ? '左下摇杆移动 · 拖动屏幕转视角' : '点击后鼠标锁定视角 · Esc 解锁'; }
  catch (err) { console.error(err); $('loading').textContent = '生成失败：' + err.message; }

$('start').addEventListener('click', () => {

  if (!isTouch) cv.requestPointerLock?.();

window.__sakura = { goScene, T, P, TR, renderer, scene };
